app = "gst-oneclick"
primary_region = "bom"

[build]

[env]
  PORT = "8080"
  NODE_ENV = "production"
  DATA_DIR = "/app/data"
  BACKUP_DIR = "/app/data/backups"

[[mounts]]
  source = "gst_data"
  destination = "/app/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
